<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>凌雪食堂</title>
<style>
:root {
  /* 暖色调：陶土橘 + 奶油米底 */
  --ink: #3A2A21;
  --ink-soft: #6B5347;
  --ink-mute: #A08D80;
  --line: #EFE2D6;
  --line-soft: #F7EFE7;
  --bg: #FDF8F3;
  --card: #FFFFFF;
  --brand: #D2694A;
  --brand-deep: #B8543A;
  --brand-soft: #F6DCCC;
  --brand-wash: #FDF0E7;
  --accent: #E9A23B;
  --danger: #C0503F;
  --radius: 16px;
  --radius-sm: 11px;
  --shadow: 0 1px 2px rgba(90, 58, 42, .05), 0 8px 24px rgba(90, 58, 42, .06);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body { min-height: 100vh; }
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

/* ---------- 手机适配 ---------- */

/* iOS Safari：可聚焦的表单控件字号 < 16px 会自动放大整个页面，
   因此仅对输入类控件提升到 16px；按钮和文本不受影响 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  min-height: 100dvh;
  /* 禁止横向抖动，同时保留纵向滚动 */
  overflow-x: hidden;
}

input, textarea, select { font-size: 16px; font-family: inherit; }
button { font-family: inherit; }

/* 触摸目标不小于 40px，手指更容易点中 */
.btn-primary, .btn-ghost, .btn-danger { min-height: 42px; }
.btn-sm { min-height: 36px; }
.order-del, .card-del, .mini-del { min-width: 40px; min-height: 40px; }
.slot-tab, .sub-tab, .tab { touch-action: manipulation; }
.picker-item, .menu-card, .wish-item, .trash-item { touch-action: manipulation; }

/* 底部导航同时适配home indicator 安全区 */
.tabbar { padding-bottom: max(var(--safe-b), 6px); }

/* 弹层内部可滚动，避免小屏被键盘顶飞（具体见下方 .modal-body） */

/* 去除 iOS 横竖屏切换时的尺寸跳变 */
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

/* ---------- 通用控件 ---------- */
.seg {
  display: flex;
  background: var(--brand-wash);
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 18px;
}
.seg-wide { width: 100%; }
.seg-btn {
  flex: 1;
  padding: 9px 8px;
  border-radius: 9px;
  font-size: 14px;
  color: var(--ink-soft);
  transition: all .18s;
}
.seg-btn.active {
  background: var(--card);
  color: var(--brand-deep);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(90, 58, 42, .09);
}

.field { display: block; }
.field > span {
  display: block;
  margin-bottom: 7px;
  font-size: 12.5px;
  color: var(--ink-soft);
  font-weight: 550;
}
.field input[type="text"],
.field input[type="email"],
.field input[type="password"],
.field input[type="date"] {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  /* 16px：iOS 聚焦输入框时不再自动放大页面 */
  font-size: 16px;
  outline: none;
  transition: border-color .18s, background .18s;
}
.field textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;   /* iOS 聚焦不放大 */
  line-height: 1.6;
  resize: vertical;
  min-height: 76px;
  outline: none;
  transition: border-color .18s, background .18s;
}
.field textarea:focus { border-color: var(--brand); background: var(--card); }
.field input:focus {
  border-color: var(--brand);
  background: var(--card);
}
.field-tip { margin: 8px 0 0; font-size: 12px; color: var(--ink-mute); line-height: 1.5; }

.field-row { display: flex; gap: 9px; }
.field-row input { flex: 1; }

.btn-primary {
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  background: var(--brand);
  color: #fff;
  font-size: 15px;
  font-weight: 550;
  transition: background .18s, transform .1s;
}
.btn-primary:hover { background: var(--brand-deep); }
.btn-primary:active { transform: scale(.985); }
.btn-primary:disabled { opacity: .55; cursor: not-allowed; }
.btn-sm { padding: 9px 15px; font-size: 13.5px; }

.btn-ghost {
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  font-size: 14px;
  transition: border-color .18s, color .18s;
}
.btn-ghost:hover { border-color: var(--brand); color: var(--brand-deep); }

.btn-link { padding: 2px 0; font-size: 13px; color: var(--brand); }
.btn-link:hover { color: var(--brand-deep); }
/* 无二次确认，破坏性操作按钮用红色标示 */
.btn-link-warn { color: var(--danger); }
.btn-link-warn:hover { color: #A8442F; }

.btn-danger {
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  background: #FBF1EF;
  color: var(--danger);
  font-size: 14px;
}

.btn-icon {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: var(--ink-soft);
  background: var(--brand-wash);
}
.btn-icon:hover { background: var(--brand-soft); }

/* ---------- 顶栏 ---------- */
.app { max-width: 620px; margin: 0 auto; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(253, 248, 243, .93);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line-soft);
}
.topbar-inner {
  max-width: 620px; margin: 0 auto;
  padding: 14px 20px;
  /* 刘海屏 /灵动岛机型：留出状态栏与浏览器工具区高度 */
  padding-top: calc(14px + env(safe-area-inset-top));
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(234, 166, 75, .18);
}
.brand-name { font-size: 16px; font-weight: 650; letter-spacing: .5px; }
.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}

.main { padding: 20px 20px 118px; }

/* ---------- 视图 ---------- */
.view { animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.page-head h2 { margin: 0; font-size: 21px; font-weight: 650; }

/* ---------- 首页 ---------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: 24px 22px;
  border-radius: 20px;
  background: linear-gradient(140deg, #E0855C 0%, #D2694A 48%, #C05A3E 100%);
  color: #fff;
  margin-bottom: 16px;
  box-shadow: 0 6px 20px rgba(200, 96, 62, .22);
}
.hero::before {
  content: '';
  position: absolute;
  top: -30px; right: -20px;
  width: 150px; height: 150px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .09);
}
.hero-body {
  position: relative;
  z-index: 1;
  padding-right: 122px;   /* 为猫咪形象留出空间 */
}
.hero-date { margin: 0 0 6px; font-size: 12.5px; opacity: .85; letter-spacing: .3px; }
.hero-title { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.4; }
.hero-sub { margin: 8px 0 0; font-size: 13px; opacity: .88; line-height: 1.5; }

/* 猫咪形象 */
.hero-mascot {
  position: absolute;
  z-index: 1;
  right: -10px;
  bottom: -18px;
  width: 128px;
  height: auto;
  filter: drop-shadow(0 4px 10px rgba(90, 40, 20, .22));
  pointer-events: none;
  user-select: none;
}

.stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
.stat {
  flex: 1;
  padding: 15px 8px;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
  text-align: center;
  transition: transform .14s;
}
.stat:active { transform: scale(.975); }
.stat-num { display: block; font-size: 23px; font-weight: 650; color: var(--brand); line-height: 1.2; }
.stat-label { display: block; margin-top: 3px; font-size: 11.5px; color: var(--ink-mute); }

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.card-head h3 { margin: 0; font-size: 15px; font-weight: 600; }

.quick-add { display: flex; gap: 8px; margin-bottom: 12px; }
.quick-add input {
  flex: 1;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-size: 16px;   /* iOS 聚焦不放大 */
  outline: none;
}
.quick-add input:focus { border-color: var(--brand); background: var(--card); }

.mini-list { display: flex; flex-direction: column; gap: 9px; }
.mini-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
}
.mini-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-item .m { font-size: 11.5px; color: var(--ink-mute); flex-shrink: 0; }
.mini-del {
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 50%;
  color: var(--ink-mute);
  font-size: 15px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .16s, color .16s;
}
.mini-del:hover { background: #FBEBE7; color: var(--danger); }
.mini-del:active { background: #F5DCD5; color: #A8442F; }

/* ---------- 点餐 ---------- */
.date-nav { display: flex; align-items: center; gap: 7px; }
.date-nav input {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--card);
  font-size: 14px;   /* 日期控件保持紧凑；它是原生控件，不会触发 iOS 缩放 */
  color: var(--ink-soft);
  outline: none;
}

.slot-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.slot-tab {
  flex: 1;
  padding: 10px;
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--ink-soft);
  font-size: 14px;
  box-shadow: var(--shadow);
  transition: all .18s;
}
.slot-tab.active { background: var(--brand); color: #fff; font-weight: 550; }

.order-list { display: flex; flex-direction: column; gap: 10px; }
.order-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  transition: opacity .2s;
}
.order-thumb {
  width: 46px; height: 46px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--brand-soft);
}
.order-info { flex: 1; min-width: 0; }
.order-name { font-size: 14.5px; font-weight: 550; margin-bottom: 2px; }
.order-meta { font-size: 11.5px; color: var(--ink-mute); }
/* 做法：最多两行，超出省略 */
.order-recipe {
  margin-top: 4px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-soft);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.order-del {
  color: var(--ink-mute);
  font-size: 17px;
  padding: 4px 6px;
  flex-shrink: 0;
  align-self: center;
  transition: color .16s;
}
.order-del:hover { color: var(--danger); }
.order-del:active { color: #A8442F; }

.picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
/* 空状态在 grid 里需跨满整行并居中，否则会被挤在第一格靠左 */
.picker-grid > .empty { grid-column: 1 / -1; }
.picker-item {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg);
  aspect-ratio: 1;
  transition: transform .14s;
}
.picker-item:active { transform: scale(.96); }
.picker-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.picker-item .cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 16px 8px 7px;
  background: linear-gradient(transparent, rgba(58, 42, 33, .78));
  color: #fff;
  font-size: 12px;
  text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.picker-item .plus {
  position: absolute; top: 6px; right: 6px;
  width: 21px; height: 21px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .92);
  color: var(--brand);
  font-size: 15px; line-height: 21px;
  text-align: center;
  font-weight: 600;
}

/* ---------- 菜单管理 ---------- */
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 4px; }
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  padding: 7px 14px;
  border-radius: 20px;
  background: var(--card);
  color: var(--ink-soft);
  font-size: 13px;
  white-space: nowrap;
  box-shadow: var(--shadow);
  transition: all .18s;
}
.chip.active { background: var(--brand); color: #fff; font-weight: 550; }

/* 菜单：单列横向卡片，做法有足够宽度完整展示 */
.menu-list { display: flex; flex-direction: column; gap: 12px; }
.menu-card {
  position: relative;
  display: flex;
  align-items: stretch;
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform .14s;
}
.menu-card:active { transform: scale(.985); }
.menu-card .pic {
  width: 108px;
  flex-shrink: 0;
  align-self: stretch;
  object-fit: cover;
  background: var(--brand-soft);
}
.menu-card .info {
  flex: 1;
  min-width: 0;
  padding: 12px 40px 12px 14px;   /* 右侧留出删除按钮的空间 */
  display: flex;
  flex-direction: column;
}

/* 卡片删除：常驻右侧，hover 才明显 */
.card-del {
  position: absolute;
  top: 50%;
  right: 8px;
  transform: translateY(-50%);
  width: 26px; height: 26px;
  border-radius: 50%;
  color: var(--ink-mute);
  font-size: 17px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .16s, color .16s;
}
.card-del:hover { background: #FBEBE7; color: var(--danger); }
.card-del:active { background: #F5DCD5; color: #A8442F; }
.menu-card .nm { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.menu-card .mt { font-size: 11.5px; color: var(--ink-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 做法：最多两行，超出省略，点击卡片可看全文 */
.menu-card .ck {
  margin-top: 6px;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--ink-soft);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.menu-card .ct {
  align-self: flex-start;
  margin-top: 8px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--brand-wash);
  color: var(--brand-deep);
  font-size: 11px;
}

/* ---------- 想吃清单 ---------- */
.wish-list { display: flex; flex-direction: column; gap: 10px; }
.wish-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 15px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: opacity .2s, transform .14s;
}
.wish-item:active { transform: scale(.99); }
.menu-card, .wish-item { cursor: pointer; }
.wish-info { flex: 1; min-width: 0; }
.wish-title { font-size: 14.5px; font-weight: 550; margin-bottom: 2px; }
.wish-meta { font-size: 11.5px; color: var(--ink-mute); }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 620px;
  display: flex;
  background: rgba(255, 255, 255, .95);
  backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--line-soft);
  padding-bottom: var(--safe-b);
  z-index: 30;
}
.tab {
  flex: 1;
  padding: 9px 4px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-mute);
  transition: color .18s;
}
.tab.active { color: var(--brand); }
.tab-icon { width: 21px; height: 21px; display: block; }
.tab-icon svg { width: 100%; height: 100%; display: block; }
.tab-label { font-size: 10.5px; font-weight: 550; }

/* ---------- 弹层 ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(58, 42, 33, .42); backdrop-filter: blur(2px); }
.modal-card {
  position: relative;
  width: 100%; max-width: 620px;
  max-height: 88vh;
  background: var(--card);
  border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column;
  animation: slideUp .25s cubic-bezier(.32, .72, 0, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.modal-head h3 { margin: 0; font-size: 16.5px; font-weight: 650; }
.modal-body {
  padding: 18px 20px 22px;
  padding-bottom: calc(22px + env(safe-area-inset-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; gap: 15px;
}
.modal-foot { display: flex; gap: 9px; align-items: center; justify-content: flex-end; padding-top: 4px; }
.modal-foot .btn-danger { margin-right: auto; }

/* ---------- 批量删除危险区 ---------- */
.danger-zone {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
  padding: 14px 16px;
  border: 1px dashed #E8C4B8;
  border-radius: var(--radius);
  background: #FDF6F3;
}
.danger-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.danger-text strong { font-size: 13.5px; font-weight: 600; color: var(--danger); }
.danger-text span { font-size: 11.5px; color: var(--ink-mute); line-height: 1.45; }
.danger-actions { display: flex; gap: 8px; flex-shrink: 0; }
.danger-zone .btn-danger { margin-right: 0; }

.head-actions { display: flex; align-items: center; gap: 14px; }

/* ---------- 删除历史 ---------- */
.trash-box {
  padding: 14px 15px;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
}
.trash-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.trash-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.trash-tip { margin: 0 0 12px; font-size: 12px; color: var(--ink-mute); }
.trash-list { display: flex; flex-direction: column; gap: 8px; }

.trash-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 11px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  opacity: .82;
}
.trash-thumb {
  width: 42px; height: 42px;
  border-radius: 9px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--brand-soft);
}
.trash-info { flex: 1; min-width: 0; }
.trash-name {
  font-size: 14px; font-weight: 550;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.trash-meta { font-size: 11.5px; color: var(--ink-mute); }
.trash-item .btn-ghost { flex-shrink: 0; color: var(--brand-deep); border-color: var(--brand-soft); }
.trash-item .btn-ghost:hover { background: var(--brand-wash); }

/* 实时保存状态提示 */
.save-state {
  margin-right: auto;
  font-size: 12px;
  color: var(--ink-mute);
  transition: color .2s;
}
.save-state.ok { color: var(--brand); }
.save-state.err { color: var(--danger); }

/* ---------- 照片选择 ---------- */
.photo-picker { display: flex; gap: 13px; align-items: flex-start; }
.photo-box {
  width: 96px; height: 96px;
  border-radius: 12px;
  border: 1px dashed var(--line);
  background: var(--bg);
  overflow: hidden;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.photo-box img { width: 100%; height: 100%; object-fit: cover; }
.photo-actions { display: flex; flex-direction: column; gap: 8px; }

/* ---------- 提示 ---------- */
.toast {
  position: fixed;
  left: 50%; bottom: 92px;
  transform: translate(-50%, 14px);
  padding: 10px 20px;
  border-radius: 22px;
  background: rgba(58, 42, 33, .93);
  color: #fff;
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 90;
  max-width: 80vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.empty {
  padding: 30px 16px;
  text-align: center;
  color: var(--ink-mute);
  font-size: 13px;
}
.empty .big { display: block; font-size: 26px; margin-bottom: 8px; opacity: .55; }

/* 三张空状态配图统一尺寸，视觉更整齐 */
.empty-gif,
.empty-want,
.empty-cook {
  display: block;
  width: 112px;
  height: auto;
  margin: 0 auto 10px;
}

.spinner {
  padding: 40px 0;
  text-align: center;
  color: var(--ink-mute);
  font-size: 13px;
}

/* ---------- 手机适配 ---------- */

/* 小屏手机（iPhone SE 等）：收紧间距与猫咪占位 */
@media (max-width: 380px) {
  .picker-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-num { font-size: 20px; }
  .hero-mascot { width: 104px; right: -12px; bottom: -14px; }
  .hero-body { padding-right: 100px; }
  .hero-title { font-size: 19px; }

  .main { padding: 16px 14px 112px; }
  .topbar-inner { padding-left: 14px; padding-right: 14px; }
  .card { padding: 15px 13px; }
  .page-head h2 { font-size: 19px; }
  .menu-card .pic { width: 88px; }
  .hero { padding: 20px 16px; }
  .modal-body { padding-left: 16px; padding-right: 16px; }
  .date-nav input { padding: 6px 8px; }
}

/* 常规手机（≤430px）：略微收紧横向留白 */
@media (max-width: 430px) {
  .main { padding: 18px 16px 116px; }
  .topbar-inner { padding-left: 16px; padding-right: 16px; }
  .tab-label { font-size: 10px; }
  .picker-grid { gap: 8px; }
}

/* 小屏横屏（如 iPhone 横放）：屏幕高度有限，压缩纵向占用 */
@media (max-height: 460px) and (orientation: landscape) {
  .hero { padding: 16px 18px; }
  .hero-mascot { width: 84px; bottom: -10px; }
  .hero-title { font-size: 18px; }
  .main { padding-top: 14px; }
  .empty-gif, .empty-want, .empty-cook { width: 84px; }
}

/* 触摸设备：去掉 hover 依赖，避免点击后样式残留 */
@media (hover: none) {
  .card-del { opacity: .55; }
  .card-del:active { opacity: 1; }
}
</style>
</head>

function todayStr(d) {
  const x = d ? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}

function shiftDate(str, days) {
  const [y, m, d] = str.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return todayStr(dt);
}

function prettyDate(str) {
  if (str === todayStr()) return '今天 · ' + str.slice(5).replace('-', ' / ');
  if (str === shiftDate(todayStr(), -1)) return '昨天 · ' + str.slice(5).replace('-', ' / ');
  if (str === shiftDate(todayStr(), 1)) return '明天 · ' + str.slice(5).replace('-', ' / ');
  return str.slice(5).replace('-', ' / ');
}

function toast(msg) {
  const el = document.getElementById('toast');

}

function escapeHtml(s) {

    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// =========================================================
// 无照片时的文字图：按菜名生成配色卡片
// =========================================================

// 无照片时的文字图配色：暖色系，与整体风格一致
const PLACEHOLDER_COLORS = [
  ['#F6DCCC', '#B8543A'],
  ['#F9E3C4', '#A9702A'],
  ['#F7DCD2', '#A85A44'],
  ['#FBE6D2', '#B0714A'],
  ['#F5DFD2', '#9C5F3E'],
  ['#F8E8D8', '#8F5B44'],
];

const placeholderCache = new Map();

function placeholderImage(name, ratio) {
  const key = name + '|' + ratio;
  if (placeholderCache.has(key)) return placeholderCache.get(key);

  const w = ratio === 'menu' ? 400 : 160;
  const h = ratio === 'menu' ? 300 : 160;
  const pair = PLACEHOLDER_COLORS[hashCode(name) % PLACEHOLDER_COLORS.length];
  const chars = Array.from(String(name || '菜')).slice(0, 4);

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, pair[0]);
  g.addColorStop(1, shade(pair[0], -14));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // 柔和光斑，避免大面积纯色显得单薄
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(w * 0.76, h * 0.22, w * 0.30, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  const twoLine = chars.length > 2;
  const perLine = twoLine ? Math.ceil(chars.length / 2) : chars.length;
  const lines = twoLine
    ? [chars.slice(0, perLine).join(''), chars.slice(perLine).join('')]
    : [chars.join('')];

  const size = ratio === 'menu'
    ? (lines.length > 1 ? 62 : 82)
    : (lines.length > 1 ? 28 : 36);
  ctx.fillStyle = pair[1];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `600 ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;

  const lineH = size * 1.22;
  const startY = h / 2 - ((lines.length - 1) * lineH) / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, w / 2, startY + i * lineH));

  const url = cv.toDataURL('image/png');
  placeholderCache.set(key, url);
  return url;
}

function hashCode(s) {
  let h = 0;
  for (let i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) | 0;
  return Math.abs(h);
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const cl = v => Math.max(0, Math.min(255, v));
  const r = cl((n >> 16) + amt), g = cl(((n >> 8) & 0xff) + amt), b = cl((n & 0xff) + amt);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

/** 菜品图：有照片用照片，没有则回退到文字图 */

// =========================================================
// 图片压缩：控制体积，适配数据库存储
// =========================================================

function compressImage(file, maxSide = 800) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) {
      return reject(new Error('请选择图片文件'));
    }
    if (file.size > 12 * 1024 * 1024) {
      return reject(new Error('图片太大了，请选一张小于 12MB 的'));
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('图片读取失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('图片解析失败'));
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale);
        h = Math.round(h * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// =========================================================

// =========================================================

/**
 * 把一道菜移入回收站：先存快照，再删原表。
 * 快照保留菜名/分类/照片/食材/做法，恢复后可完整还原。
 */
async function moveToTrash(dish) {
  const { error: insErr } = await cloud.database.from('trash_dishes').insert({
    origin_id: dish.id,
    name: dish.name,
    category: dish.category,
    image_data: dish.image_data || null,
    ingredients: dish.ingredients,
    note: dish.note,
  });
  if (insErr) return { error: insErr };

  const { data, error } = await cloud.database
    .from('dishes').delete().eq('id', dish.id).select();
  if (error) return { error };
  if (!data || !data.length) return { notFound: true };
  return { ok: true };
}

/**
 * 批量移入回收站。
 * @param {object} opt - ids: 要处理的菜品 id 数组
 */
async function bulkTrash(opt) {
  const ids = opt.ids || [];
  if (!ids.length) {
    toast(opt.emptyText || '没有可删除的内容');
    return;
  }

  let moved = 0;
  for (const id of ids) {
    const dish = state.dishes.find(d => d.id === id);
    if (!dish) continue;
    const res = await moveToTrash(dish);
    if (res.error || res.notFound) {
      toast(`已移入回收站 ${moved}/${ids.length} 道后出错：${(res.error && res.error.message) || '菜品不存在'}`);
      await refresh();
      return;
    }
    moved++;
  }

  toast(opt.doneText || '已移入回收站');
  await refresh();
}

// =========================================================
// 批量删除：直接执行，无需确认
// =========================================================

/**
 * 通用批量删除。
 * @param {object} opt
 *  - ids       要删除的 id 数组（逐条删除，范围可精确核对）
 *  - run对单个 id 执行删除
 */
async function bulkDelete(opt) {
  const ids = opt.ids || [];
  const n = ids.length;
  if (n === 0) {
    toast(opt.emptyText || '没有可删除的内容');
    return;
  }

  // 逐条删除：任一条失败即中止，并明确告知已删除多少条
  let removed = 0;
  for (const id of ids) {
    const { error } = await opt.run(id);
    if (error) {
      toast(`已删除 ${removed}/${n} 条后出错：${error.message}`);
      await refresh();
      return;
    }
    removed++;
  }

  toast(opt.doneText || '已清空');
  await refresh();
}

/** 把时间戳格式化为「10-05 14:32」 */
function formatStamp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

document.getElementById('quick-wish-btn').addEventListener('click', async () => {
  const input = document.getElementById('quick-wish');
  const title = input.value.trim();
  if (!title) return toast('先写点什么吧');
  const { error } = await cloud.database.from('wish_items').insert({
    owner_name: me(), title, kind: 'dish', status: 'pending',
  });
  if (error) return toast(error.message);
  input.value = '';
  toast('已记到想吃清单');
  await refresh();
});

document.getElementById('quick-wish').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('quick-wish-btn').click();
});

// 随手记：删除单条
document.getElementById('home-wishes').addEventListener('click', async e => {
  const btn = e.target.closest('[data-del-quick]');
  if (!btn) return;
  const { error } = await cloud.database
    .from('wish_items').delete().eq('id', btn.dataset.delQuick).select();
  if (error) return toast(error.message);
  toast('已删除');
  await refresh();
});

// =========================================================
// 渲染：点餐
// =========================================================

document.getElementById('date-picker').value = state.date;
document.getElementById('date-prev').addEventListener('click', () => {
  state.date = shiftDate(state.date, -1);
  document.getElementById('date-picker').value = state.date;
  render();
});
document.getElementById('date-next').addEventListener('click', () => {
  state.date = shiftDate(state.date, 1);
  document.getElementById('date-picker').value = state.date;
  render();
});
document.getElementById('date-picker').addEventListener('change', e => {
  state.date = e.target.value || todayStr();
  render();
});

document.querySelectorAll('.slot-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    state.slot = btn.dataset.slot;
    document.querySelectorAll('.slot-tab').forEach(b => b.classList.toggle('active', b === btn));
    renderOrderList();
    document.getElementById('slot-title').textContent = state.slot;
  });
});

function renderOrderList() {
  const list = document.getElementById('order-list');
  document.getElementById('slot-title').textContent =
    state.slot + ' · ' + prettyDate(state.date);

document.addEventListener('click', async e => {
  const d = e.target.closest('[data-del-order]');
  if (d) return deleteOrder(d.dataset.delOrder);

  const p = e.target.closest('[data-pick]');
  if (p) {
    const dish = state.dishes.find(x => x.id === Number(p.dataset.pick));
    if (!dish) return;
    // 只存 dish_id 引用，图片实时取自菜单，避免照片重复占用空间
    const { error } = await cloud.database.from('meal_orders').insert({
      owner_name: me(),
      dish_id: dish.id,
      dish_name: dish.name,
      dish_image: null,
      slot: state.slot,
      order_date: state.date,
      status: 'planned',
    });
    if (error) return toast(error.message);
    toast(`${dish.name} 已加入${state.slot}`);
    await refresh();
  }
});

// =========================================================
// 渲染：菜单管理
// =========================================================

function renderMenu() {
  const cats = ['全部'];
  state.dishes.forEach(d => { if (d.category && !cats.includes(d.category)) cats.push(d.category); });
  DEFAULT_CATEGORIES.forEach(c => { if (!cats.includes(c)) cats.push(c); });

  const bar = document.getElementById('menu-filters');
  if (bar.dataset.cats !== cats.join('|')) {
    bar.dataset.cats = cats.join('|');
    bar.innerHTML = cats.map(c =>
      `<button class="chip ${c === state.menuCat ? 'active' : ''}" data-cat="${escapeHtml(c)}" type="button">${escapeHtml(c)}</button>`
    ).join('');
    bar.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        state.menuCat = chip.dataset.cat;
        renderMenu();
      });
    });
  } else {
    bar.querySelectorAll('.chip').forEach(c =>
      c.classList.toggle('active', c.dataset.cat === state.menuCat));
  }

  document.getElementById('cat-list').innerHTML =
    cats.filter(c => c !== '全部')
      .map(c => `<option value="${escapeHtml(c)}">`)
      .join('');

  const list = document.getElementById('menu-list');
  const items = state.menuCat === '全部'
    ? state.dishes
    : state.dishes.filter(d => d.category === state.menuCat);

  if (!items.length) {
    list.innerHTML = `<div class="empty"><span class="big">🍳</span>${
      state.dishes.length ? '这个分类还没有菜' : '还没有菜品，点右上角添加'
    }</div>`;
    return;
  }

  list.innerHTML = items.map(d => `
    <div class="menu-card" data-edit="${d.id}">
      <img class="pic" src="${dishImg(d, 'menu')}" alt="${escapeHtml(d.name)}" loading="lazy">
      <div class="info">
        <div class="nm">${escapeHtml(d.name)}</div>
        <div class="mt">${escapeHtml(d.ingredients || '未填食材')}</div>
        ${d.note ? `<div class="ck" title="${escapeHtml(d.note)}">${escapeHtml(d.note)}</div>` : ''}
        <span class="ct">${escapeHtml(d.category || '家常菜')}</span>
      </div>
      <button class="card-del" data-del-dish="${d.id}" type="button" title="删除这道菜" aria-label="删除${escapeHtml(d.name)}">×</button>
    </div>`).join('');
}

// ---- 删除历史 ----
function renderTrash() {
  const box = document.getElementById('trash-box');
  box.classList.toggle('hidden', !state.showTrash);
  const btn = document.getElementById('toggle-trash-btn');
  btn.textContent = state.showTrash
    ? `删除历史（${state.trash.length}）` : '删除历史';
  if (!state.showTrash) return;

  const list = document.getElementById('trash-list');
  if (!state.trash.length) {
    list.innerHTML = `<div class="empty" style="padding:18px">还没有删除过菜品</div>`;
    return;
  }

  list.innerHTML = state.trash.map(t => `
    <div class="trash-item">
      <img class="trash-thumb" src="${dishImg({ name: t.name, image_data: t.image_data }, 'menu')}" alt="">
      <div class="trash-info">
        <div class="trash-name">${escapeHtml(t.name)}</div>
        <div class="trash-meta">${formatStamp(t.deleted_at)} 删除${t.category ? ' · ' + escapeHtml(t.category) : ''}</div>
      </div>
      <button class="btn-ghost btn-sm" data-restore="${t.id}" type="button">恢复</button>
      <button class="order-del" data-purge="${t.id}" type="button" title="彻底删除">×</button>
    </div>`).join('');
}

/** 恢复一道菜到菜单 */
async function restoreOne(item) {
  // 同名菜已存在时不重复插入，避免菜单里出现两份相同菜
  if (state.dishes.some(d => d.name === item.name)) {
    return toast(`菜单里已有「${item.name}」，未重复恢复`);
  }
  const { data, error } = await cloud.database.from('dishes').insert({
    name: item.name,
    category: item.category,
    image_data: item.image_data || null,
    ingredients: item.ingredients,
    note: item.note,
  }).select();
  if (error) return toast(error.message);

  // 本地临时条目（字符串 id）也要清理
  const trashId = item.id;
  const del = await cloud.database
    .from('trash_dishes').delete().eq('id', trashId).select();
  if (del.error) return toast(del.error.message);

  toast(`「${item.name}」已恢复到菜单`);
  await refresh();
}

document.getElementById('toggle-trash-btn').addEventListener('click', () => {
  state.showTrash = !state.showTrash;
  renderTrash();
});

document.getElementById('trash-list').addEventListener('click', async e => {
  const r = e.target.closest('[data-restore]');
  if (r) {
    const item = state.trash.find(t => String(t.id) === r.dataset.restore);
    if (item) await restoreOne(item);
    return;
  }
  const p = e.target.closest('[data-purge]');
  if (p) {
    const item = state.trash.find(t => String(t.id) === p.dataset.purge);
    if (!item) return;
    // 刚删除的本地条目尚未落库，直接从视图移除即可
    if (String(item.id).startsWith('tmp-')) {
      state.trash = state.trash.filter(t => t.id !== item.id);
      toast('已彻底删除');
      renderTrash();
      return;
    }
    const { error } = await cloud.database
      .from('trash_dishes').delete().eq('id', item.id).select();
    if (error) return toast(error.message);
    state.trash = state.trash.filter(t => t.id !== item.id);
    toast('已彻底删除，无法恢复');
    renderTrash();
  }
});

// 全部恢复：逐条恢复，兼容同名已存在的情况
document.getElementById('restore-all-btn').addEventListener('click', async () => {
  const items = state.trash.slice();
  if (!items.length) return toast('删除历史是空的');
  let ok = 0;
  for (const item of items) {
    if (state.dishes.some(d => d.name === item.name)) continue;
    const { error } = await cloud.database.from('dishes').insert({
      name: item.name,
      category: item.category,
      image_data: item.image_data || null,
      ingredients: item.ingredients,
      note: item.note,
    }).select();
    if (error) break;
    if (!String(item.id).startsWith('tmp-')) {
      await cloud.database.from('trash_dishes').delete().eq('id', item.id);
    }
    ok++;
  }
  toast(ok ? `已恢复 ${ok} 道菜` : '没有可恢复的菜（菜单里已存在同名菜）');
  await refresh();
});

// 清空历史：连同恢复机会一起丢弃
document.getElementById('empty-trash-btn').addEventListener('click', () => {
  bulkDelete({
    ids: state.trash.filter(t => !String(t.id).startsWith('tmp-')).map(t => t.id),
    emptyText: '删除历史是空的',
    doneText: '删除历史已清空',
    run: id => cloud.database.from('trash_dishes').delete().eq('id', id).select(),
  });
});

// 卡片点击进编辑；删除按钮独立处理并阻止冒泡，避免误开编辑弹层
document.getElementById('menu-list').addEventListener('click', async e => {
  const del = e.target.closest('[data-del-dish]');
  if (del) {
    e.stopPropagation();
    const dish = state.dishes.find(d => d.id === Number(del.dataset.delDish));
    if (!dish) return;
    const res = await moveToTrash(dish);
    if (res.error) return toast(res.error.message);
    if (res.notFound) return toast('这道菜可能已被删除');
    state.dishes = state.dishes.filter(d => d.id !== dish.id);
    state.trash.unshift({
      id: 'tmp-' + Date.now(), origin_id: dish.id, name: dish.name,
      category: dish.category, image_data: dish.image_data,
      ingredients: dish.ingredients, note: dish.note, deleted_at: new Date().toISOString(),
    });
    toast(`「${dish.name}」已移入删除历史，可恢复`);
    render();
    return;
  }

  const card = e.target.closest('[data-edit]');
  if (card) openDishModal(state.dishes.find(d => d.id === Number(card.dataset.edit)));
});

// ---- 菜品弹层 ----
const dishModal = document.getElementById('dish-modal');
let editingDish = null;
let pendingPhoto = null;

document.getElementById('add-dish-btn').addEventListener('click', () => openDishModal(null));

function openDishModal(dish) {
  editingDish = dish || null;
  pendingPhoto = dish ? (dish.image_data || null) : null;

  document.getElementById('dish-modal-title').textContent = dish ? '编辑菜品' : '添加菜品';
  document.getElementById('dish-name').value = dish ? dish.name : '';
  document.getElementById('dish-cat').value = dish ? (dish.category || '') : '';
  document.getElementById('dish-ing').value = dish ? (dish.ingredients || '') : '';
  document.getElementById('dish-note').value = dish ? (dish.note || '') : '';
  document.getElementById('dish-delete').classList.toggle('hidden', !dish);

  setSaveState('修改会自动保存');
  updatePhotoBox();
  dishModal.classList.remove('hidden');
  setTimeout(() => document.getElementById('dish-name').focus(), 60);
}

function updatePhotoBox() {
  const box = document.getElementById('photo-box');
  const name = document.getElementById('dish-name').value.trim() || '新菜品';
  box.innerHTML = pendingPhoto
    ? `<img src="${pendingPhoto}" alt="">`
    : `<img src="${placeholderImage(name, 'menu')}" alt="">`;
}

document.getElementById('dish-name').addEventListener('input', updatePhotoBox);

document.getElementById('photo-choose').addEventListener('click', () =>
  document.getElementById('photo-input').click());

// ---- 实时保存：输入停顿后自动写入 ----
let saveTimer = null;
const saveState = document.getElementById('dish-save-state');

function setSaveState(text, tone) {
  if (!saveState) return;
  saveState.textContent = text;
  saveState.className = 'save-state' + (tone ? ' ' + tone : '');
}

function collectDish() {
  const name = document.getElementById('dish-name').value.trim();
  return {
    name: name || '未命名菜品',
    category: document.getElementById('dish-cat').value.trim() || '家常菜',
    ingredients: document.getElementById('dish-ing').value.trim(),
    note: document.getElementById('dish-note').value.trim(),
    image_data: pendingPhoto,
    updated_at: new Date().toISOString(),
  };
}

/** 新菜品首次输入时立刻建档，之后走更新 */
async function persistDish() {
  const payload = collectDish();

  if (!editingDish) {
    const { data, error } = await cloud.database
      .from('dishes').insert(payload).select();
    if (error) {
      setSaveState('保存失败：' + error.message, 'err');
      toast(error.message || '保存失败');
      return;
    }
    if (data && data.length) {
      editingDish = data[0];
      state.dishes.unshift(data[0]);
      renderMenu();
      renderPicker();
      renderHome();
    }
    setSaveState('已保存', 'ok');
    return;
  }

  const { data, error } = await cloud.database
    .from('dishes').update(payload).eq('id', editingDish.id).select();
  if (error) {
    setSaveState('保存失败：' + error.message, 'err');
    toast(error.message || '保存失败');
    return;
  }
  if (data && data.length) {
    const i = state.dishes.findIndex(d => d.id === editingDish.id);
    if (i >= 0) state.dishes[i] = data[0];
    renderMenu();
    renderHome();
  }
  setSaveState('已保存', 'ok');
}

function scheduleSave() {
  setSaveState('保存中…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistDish, 700);
}

['dish-name', 'dish-cat', 'dish-ing', 'dish-note'].forEach(id => {
  document.getElementById(id).addEventListener('input', scheduleSave);
});

document.getElementById('photo-input').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    setSaveState('照片处理中…');
    pendingPhoto = await compressImage(file);
    updatePhotoBox();
    await persistDish();
  } catch (err) {
    setSaveState('保存失败', 'err');
    toast(err.message || '照片处理失败');
  }
  e.target.value = '';
});

document.getElementById('photo-clear').addEventListener('click', () => {
  pendingPhoto = null;
  updatePhotoBox();
  persistDish();
});

document.getElementById('dish-delete').addEventListener('click', async () => {
  if (!editingDish) return;
  clearTimeout(saveTimer);
  const res = await moveToTrash(editingDish);
  if (res.error) return toast(res.error.message);
  if (res.notFound) return toast('这道菜可能已被删除');
  state.dishes = state.dishes.filter(d => d.id !== editingDish.id);
  state.trash.unshift({
    id: 'tmp-' + Date.now(), origin_id: editingDish.id, name: editingDish.name,
    category: editingDish.category, image_data: editingDish.image_data,
    ingredients: editingDish.ingredients, note: editingDish.note,
    deleted_at: new Date().toISOString(),
  });
  dishModal.classList.add('hidden');
  toast('已移入删除历史，可恢复');
  editingDish = null;
  render();
});

// =========================================================
// 渲染：想吃清单
// =========================================================

document.querySelectorAll('#view-wish .seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.wishKind = btn.dataset.kind;
    document.querySelectorAll('#view-wish .seg-btn').forEach(b =>
      b.classList.toggle('active', b === btn));
    renderWish();
  });
});

function renderWish() {
  const box = document.getElementById('wish-list');
  const items = state.wishes.filter(w => w.kind === state.wishKind);

  if (!items.length) {
    const kind = state.wishKind === 'ingredient' ? '食材' : '成品';
    box.innerHTML = `<div class="empty"><span class="big">${state.wishKind === 'ingredient' ? '🥬' : '🍲'}</span>${kind}清单里还没有东西<br><span style="font-size:12px">点右上角添加</span></div>`;
    return;
  }

  box.innerHTML = items.map(w => `
    <div class="wish-item" data-edit-wish="${w.id}">
      <div class="wish-info">
        <div class="wish-title">${escapeHtml(w.title)}</div>
        <div class="wish-meta">${escapeHtml(w.owner_name || me())}${w.note ? ' · ' + escapeHtml(w.note) : ''}</div>
      </div>
      <button class="order-del" data-del-wish="${w.id}" type="button" title="删除">×</button>
    </div>`).join('');
}

document.getElementById('wish-list').addEventListener('click', async e => {
  const delBtn = e.target.closest('[data-del-wish]');
  if (delBtn) {
    e.stopPropagation();
    const { data, error } = await cloud.database
      .from('wish_items').delete().eq('id', delBtn.dataset.delWish).select();
    if (error) return toast(error.message);
    if (!data || !data.length) return toast('这条可能已被删除');
    toast('已移除');
    return refresh();
  }

  const row = e.target.closest('[data-edit-wish]');
  if (row) {
    const item = state.wishes.find(w => w.id === Number(row.dataset.editWish));
    if (item) openWishModal(item);
  }
});

// ---- 想吃弹层：实时保存 ----
const wishModal = document.getElementById('wish-modal');
let wishKindInModal = 'ingredient';
let editingWish = null;
let wishSaveTimer = null;
const wishSaveState = document.getElementById('wish-save-state');

function setWishSaveState(text, tone) {
  if (!wishSaveState) return;
  wishSaveState.textContent = text;
  wishSaveState.className = 'save-state' + (tone ? ' ' + tone : '');
}

function openWishModal(item) {
  editingWish = item || null;
  wishKindInModal = item ? item.kind : state.wishKind;
  document.getElementById('wish-modal-title').textContent = item ? '编辑这条' : '添加到想吃清单';
  document.getElementById('wish-title').value = item ? item.title : '';
  document.getElementById('wish-note').value = item ? (item.note || '') : '';
  document.getElementById('wish-delete').classList.toggle('hidden', !item);
  document.querySelectorAll('#wish-modal .seg-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.kind === wishKindInModal));
  setWishSaveState('修改会自动保存');
  wishModal.classList.remove('hidden');
  setTimeout(() => document.getElementById('wish-title').focus(), 60);
}

document.getElementById('add-wish-btn').addEventListener('click', () => openWishModal(null));

document.querySelectorAll('#wish-modal .seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    wishKindInModal = btn.dataset.kind;
    document.querySelectorAll('#wish-modal .seg-btn').forEach(b =>
      b.classList.toggle('active', b === btn));
    scheduleWishSave();
  });
});

async function persistWish() {
  const payload = {
    owner_name: me(),
    title: document.getElementById('wish-title').value.trim() || '未命名',
    kind: wishKindInModal,
    note: document.getElementById('wish-note').value.trim(),
    status: editingWish ? editingWish.status : 'pending',
  };

  if (!editingWish) {
    const { data, error } = await cloud.database
      .from('wish_items').insert(payload).select();
    if (error) {
      setWishSaveState('保存失败：' + error.message, 'err');
      toast(error.message || '保存失败');
      return;
    }
    if (data && data.length) {
      editingWish = data[0];
      state.wishes.unshift(data[0]);
      document.getElementById('wish-delete').classList.remove('hidden');
      renderWish();
      renderHome();
    }
    setWishSaveState('已保存', 'ok');
    return;
  }

  const { data, error } = await cloud.database
    .from('wish_items').update(payload).eq('id', editingWish.id).select();
  if (error) {
    setWishSaveState('保存失败：' + error.message, 'err');
    toast(error.message || '保存失败');
    return;
  }
  if (data && data.length) {
    const i = state.wishes.findIndex(w => w.id === editingWish.id);
    if (i >= 0) state.wishes[i] = data[0];
    renderHome();
  }
  setWishSaveState('已保存', 'ok');
}

function scheduleWishSave() {
  setWishSaveState('保存中…');
  clearTimeout(wishSaveTimer);
  wishSaveTimer = setTimeout(persistWish, 700);
}

['wish-title', 'wish-note'].forEach(id => {
  document.getElementById(id).addEventListener('input', scheduleWishSave);
});

document.getElementById('wish-delete').addEventListener('click', async () => {
  if (!editingWish) return wishModal.classList.add('hidden');
  clearTimeout(wishSaveTimer);
  const { data, error } = await cloud.database
    .from('wish_items').delete().eq('id', editingWish.id).select();
  if (error) return toast(error.message);
  if (!data || !data.length) return toast('这条可能已被删除');
  state.wishes = state.wishes.filter(w => w.id !== editingWish.id);
  wishModal.classList.add('hidden');
  editingWish = null;
  toast('已移除');
  renderWish();
  renderHome();
});

// =========================================================
// 身份
// =========================================================

const meModal = document.getElementById('me-modal');
document.getElementById('who-btn').addEventListener('click', () => {
  document.getElementById('me-name').value = state.name;
  document.getElementById('me-title').textContent = '你的名字';
  document.getElementById('me-tip').textContent =
    '名字只保存在这台设备上，用来标记是谁点的菜，朋友那边会看到。';
  meModal.classList.remove('hidden');
});

document.getElementById('me-save').addEventListener('click', () => {
  const n = document.getElementById('me-name').value.trim();
  localStorage.setItem('hd_name', n);
  state.name = n;
  meModal.classList.add('hidden');
  toast('已保存');
  render();
});

/** 关闭弹层前先落盘，避免待保存的修改丢失 */
function closeModal(modal) {
  if (modal && modal.id === 'dish-modal') persistDish();
  if (modal && modal.id === 'wish-modal') persistWish();
  modal.classList.add('hidden');
}

// 关闭弹层
document.querySelectorAll('[data-close]').forEach(el => {
  el.addEventListener('click', () => closeModal(el.closest('.modal')));
});
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) closeModal(m); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal:not(.hidden)').forEach(m => closeModal(m));
  }
});

// =========================================================
// 主渲染与启动
// =========================================================

function render() {
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById('view-' + state.view).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.go === state.view));
  document.getElementById('who-btn').textContent = initials();

  renderHome();

  if (state.view === 'order') {
    document.querySelectorAll('.slot-tab').forEach(b =>
      b.classList.toggle('active', b.dataset.slot === state.slot));
    document.getElementById('date-picker').value = state.date;
    renderOrderList();
    renderPicker();
  }
  if (state.view === 'menu') { renderMenu(); renderTrash(); }
  if (state.view === 'wish') renderWish();
}

async function boot() {
  // 免登录：直接读取共享数据
  try {
    await loadAll();
  } catch (e) {
    toast(e.message || '数据加载失败');
  }
  render();

  // 未设置名字时，主动引导一次，仅本机保存
  if (!state.name) {
    setTimeout(() => {
      document.getElementById('me-title').textContent = '先给自己起个名字';
      document.getElementById('me-tip').textContent =
        '不用登录，名字只存在这台设备上，用来标记哪道菜是谁想吃的。';
      const m = document.getElementById('me-modal');
      m.classList.remove('hidden');
      setTimeout(() => document.getElementById('me-name').focus(), 60);
    }, 400);
  }
}

boot();
</script>
</body>
</html>
